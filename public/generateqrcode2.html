<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate QR Code (Company-wise)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #f5f0ff, #faf6ff);
      padding: 20px;
    }
    .container { max-width: 1200px; margin: auto; display: flex; flex-direction: column; gap: 40px; }
    .card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 15px 40px rgba(138,43,226,.2); position: relative; }
    h2 { color: #6a0dad; margin-bottom: 20px; }
    .upload-form { display: flex; flex-direction: column; gap: 16px; }
    select, input, button {
      padding: 14px; border-radius: 12px; font-size: 1rem;
    }
    select, input { border: 2px solid #e0e0e0; }
    select:focus, input:focus { border-color: #8a2be2; outline: none; }
    button {
      border: none; background: linear-gradient(135deg,#8a2be2,#9370db);
      color: #fff; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }

    .tile-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap: 20px; margin-top: 20px; }
    .tile-item { 
      background:#f8f9fa; 
      padding:20px; 
      border-radius:16px; 
      text-align:center; 
      height: 280px;
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }
    .tile-item img {
      width: 100%;
      height: 150px;
      object-fit: contain;
      border-radius: 10px;
      background: #f9f9f9;
    }
    .tile-item p { margin-top:10px; font-weight:600; color:#6a0dad; }
    .actions { display:flex; justify-content:center; gap:10px; margin-top:10px; }
    .actions button { background:none; color:#555; font-size:1.2rem; }
    .actions button:hover { color:#8a2be2; }
    .message { margin-top:10px; }
    .error { color:#d9534f; }
    .success { color:#5cb85c; }

    .search-container { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
    .tile-search { flex: 1; }
    .search-btn { padding: 14px 16px; background: #8a2be2; color: white; border-radius: 12px; cursor: pointer; }
    .search-btn:hover { background: #9370db; }

    .company-list { display: grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap: 20px; margin-top: 20px; }
    .company-item { background: #8a2be2; color: white; padding: 20px; border-radius: 16px; text-align: center; cursor: pointer; transition: background 0.3s; }
    .company-item:hover { background: #9370db; }
    .company-item h3 { color: white; margin: 0; }
    .back-btn { margin-bottom: 20px; background: #6a0dad; padding: 10px 20px; border-radius: 12px; color: white; cursor: pointer; }
    .back-btn:hover { background: #5a0b8a; }

    .hidden { display: none; }

    .company-wrapper { display: flex; align-items: center; gap: 10px; }
    .company-number { font-weight: bold; color: #6a0dad; font-size: 1.2rem; }

    .update-images-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #6a0dad;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.3s;
      z-index: 10;
    }
    .update-images-btn:hover { background: #5a0b8a; }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 300px;
      width: 90%;
    }
    .modal-content h3 { margin-bottom: 20px; color: #6a0dad; }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .modal-btn.mail { background: #8a2be2; color: white; }
    .modal-btn.mail:hover { background: #9370db; }
    .modal-btn.phone { background: #25d366; color: white; }
    .modal-btn.phone:hover { background: #128c7e; }
  </style>
</head>
<body>

<div class="container">

  <div class="card">
    <h2><i class="fas fa-building"></i> Manage Companies</h2>
    <div class="upload-form">
      <input type="text" id="newCompanyName" placeholder="Enter new company name" />
      <button id="addCompanyBtn"><i class="fas fa-plus"></i> Add Company</button>
    </div>

    <hr style="margin:30px 0; border:none; border-top:1px solid #eee;" />

    <h2><i class="fas fa-upload"></i> Upload Tile Image</h2>
    <form id="uploadForm" class="upload-form">
      <input type="text" id="companySelect" list="companyDatalist" placeholder="Select or type company name" required />
      <datalist id="companyDatalist"></datalist>
      <input type="file" id="imageInput" accept="image/*" required />
      <input type="text" id="imageName" placeholder="Enter tile name" required />
      <button type="submit" id="convertBtn"><i class="fas fa-save"></i> Upload & Save</button>
    </form>
    <div id="uploadMessage" class="message"></div>
  </div>

  <div class="card">
    <h2><i class="fas fa-image"></i> Company-wise Tile QRcodes</h2>
    <button class="update-images-btn" id="updateBtn">Update Images</button>
    <div class="search-container">
      <input
        type="text"
        class="tile-search"
        placeholder="Search..."
        id="tileSearchInput">
      <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <button class="back-btn hidden" id="backBtn"><i class="fas fa-arrow-left"></i> Back to Companies</button>
    <div id="companyList" class="company-list"></div>
    <div id="tileGrid" class="tile-grid hidden"></div>
  </div>

  <div id="updateModal" class="modal">
    <div class="modal-content">
      <h3>Select Update Method</h3>
      <div class="modal-buttons">
        <button class="modal-btn mail" id="mailBtn">Via Mail ID</button>
        <button class="modal-btn phone" id="phoneBtn">WhatsApp</button>
      </div>
    </div>
  </div>

</div>

<script type="module">
  import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm";
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-storage.js";
  import { getDatabase, ref as dbRef, get, push, set, remove } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDLwU2O2MQA3SWSlbw9Wa75_KByQ0EkZI8",
    authDomain: "raav3d-50f8c.firebaseapp.com",
    databaseURL: "https://raav3d-50f8c-default-rtdb.firebaseio.com",
    projectId: "raav3d-50f8c",
    storageBucket: "raav3d-50f8c.firebasestorage.app",
    messagingSenderId: "528524618407",
    appId: "1:528524618407:web:acb2c4fca0dcadd7934982"
  };

  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  const database = getDatabase(app);

  const newCompanyNameInput = document.getElementById('newCompanyName');
  const addCompanyBtn = document.getElementById('addCompanyBtn');
  const uploadForm = document.getElementById('uploadForm');
  const imageInput = document.getElementById('imageInput');
  const imageNameInput = document.getElementById('imageName');
  const convertBtn = document.getElementById('convertBtn');
  const uploadMessage = document.getElementById('uploadMessage');
  const companyList = document.getElementById('companyList');
  const tileGrid = document.getElementById('tileGrid');
  const companySelect = document.getElementById('companySelect');
  const companyDatalist = document.getElementById('companyDatalist');
  const tileSearchInput = document.getElementById('tileSearchInput');
  const searchBtn = document.getElementById('searchBtn');
  const backBtn = document.getElementById('backBtn');
  const updateModal = document.getElementById('updateModal');
  const mailBtn = document.getElementById('mailBtn');
  const phoneBtn = document.getElementById('phoneBtn');
  const updateBtn = document.getElementById('updateBtn');

  let currentCompanyId = null;
  let companyMap = {};

  newCompanyNameInput.addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase();
  });

  imageNameInput.addEventListener('input', (e) => {
    e.target.value = e.target.value.toUpperCase();
  });

  function filterItems() {
    const searchText = tileSearchInput.value.toLowerCase();
    if (!tileGrid.classList.contains('hidden')) {
      document.querySelectorAll('.tile-item').forEach(tile => {
        const name = tile.querySelector('p').textContent.toLowerCase();
        const shouldShow = name.includes(searchText);
        tile.style.display = shouldShow ? 'block' : 'none';
        
        if (shouldShow) {
          const img = tile.querySelector('img');
          if (img && img.hasAttribute('data-src') && img.src === '') {
            img.src = img.getAttribute('data-src');
            img.removeAttribute('data-src');
            img.onerror = () => {
              img.src = 'https://via.placeholder.com/150?text=Image+Not+Found';
              img.onerror = null;
            };
          }
        }
      });
    } else {
      document.querySelectorAll('.company-item').forEach(company => {
        const name = company.querySelector('h3').textContent.toLowerCase();
        company.style.display = name.includes(searchText) ? 'block' : 'none';
      });
    }
  }

  searchBtn.addEventListener('click', filterItems);
  tileSearchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') filterItems();
  });

  backBtn.addEventListener('click', () => {
    companyList.classList.remove('hidden');
    tileGrid.classList.add('hidden');
    backBtn.classList.add('hidden');
    tileSearchInput.value = '';
    currentCompanyId = null;
  });

  document.addEventListener('click', (e) => {
    if (e.target === updateModal) updateModal.style.display = 'none';
  });

  updateBtn.addEventListener('click', () => {
    updateModal.style.display = 'flex';
  });

  mailBtn.addEventListener('click', () => {
    updateModal.style.display = 'none';
    window.location.href = 'mailto:raav2d3d@gmail.com?subject=Update Images&body=Please find attached the updated images.';
  });

  phoneBtn.addEventListener('click', () => {
    updateModal.style.display = 'none';
    window.location.href = 'whatsapp://send?phone=6364432791&text=Please find attached the updated images.';
  });

  async function loadCompanies() {
    companyDatalist.innerHTML = '';
    companyMap = {};
    const snap = await get(dbRef(database, 'companies'));
    if (!snap.exists()) return;
    snap.forEach(c => {
      const option = document.createElement('option');
      option.value = c.val().name;
      companyDatalist.appendChild(option);
      companyMap[c.val().name.toLowerCase()] = c.key;
    });
  }

  async function loadCompanyList() {
    companyList.innerHTML = '';
    const snap = await get(dbRef(database, 'companies'));
    if (!snap.exists()) return;

    const companies = [];
    snap.forEach(companySnap => {
      companies.push({ id: companySnap.key, name: companySnap.val().name });
    });

    companies.sort((a, b) => a.name.localeCompare(b.name));

    companies.forEach((company, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'company-wrapper';

      const number = document.createElement('span');
      number.className = 'company-number';
      number.textContent = `${index + 1}.`;

      const item = document.createElement('div');
      item.className = 'company-item';
      item.innerHTML = `<h3>${company.name}</h3>`;
      item.onclick = () => showCompanyTiles(company.id, company.name);

      wrapper.appendChild(number);
      wrapper.appendChild(item);
      companyList.appendChild(wrapper);
    });
  }

  async function showCompanyTiles(companyId, companyName) {
    currentCompanyId = companyId;
    tileGrid.innerHTML = `<h3>${companyName}</h3>`;
    const snap = await get(dbRef(database, `companies/${companyId}/qrCodes`));
    if (!snap.exists()) {
      tileGrid.innerHTML += '<p>No tiles found for this company.</p>';
    } else {
      Object.entries(snap.val()).forEach(([id, tile]) => {
        const item = document.createElement('div');
        item.className = 'tile-item';

        const img = document.createElement('img');
        img.src = '';
        img.setAttribute('data-src', tile.imageUrl);
        img.alt = tile.name;
        item.appendChild(img);

        const p = document.createElement('p');
        p.textContent = tile.name;
        item.appendChild(p);

        const actions = document.createElement('div');
        actions.className = 'actions';

        const del = document.createElement('button');
        del.innerHTML = '<i class="fas fa-trash"></i>';
        del.onclick = async () => {
          if (confirm('Are you sure you want to delete this tile?')) {
            await remove(dbRef(database, `companies/${companyId}/qrCodes/${id}`));
            await deleteObject(ref(storage, tile.path));
            showCompanyTiles(companyId, companyName);
          }
        };
        actions.appendChild(del);

        const downloadBtn = document.createElement('button');
        downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
        downloadBtn.onclick = async () => {
          try {
            const canvas = document.createElement('canvas');

            await QRCode.toCanvas(canvas, tile.imageUrl, {
              width: 300,
              margin: 2
            });

            const qrDataURL = canvas.toDataURL('image/png');

            const link = document.createElement('a');
            link.href = qrDataURL;
            link.download = tile.name + '_QR.png';
            link.click();

          } catch (error) {
            console.error('Error generating QR code:', error);
            alert('Failed to generate QR code.');
          }
        };
        actions.appendChild(downloadBtn);

        item.appendChild(actions);

        tileGrid.appendChild(item);
      });
    }

    companyList.classList.add('hidden');
        tileGrid.classList.remove('hidden');
    backBtn.classList.remove('hidden');
    tileSearchInput.value = ''; // Clear search input when entering tile view

    // Initialize lazy loading for images
    const images = tileGrid.querySelectorAll('img[data-src]');
    const imageObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.getAttribute('data-src');
          img.removeAttribute('data-src');
          observer.unobserve(img);
        }
      });
    }, {
      rootMargin: '100px' // Load images 100px before they enter the viewport
    });

    images.forEach(img => imageObserver.observe(img));
  }

  async function loadTiles() {
    // This is now handled by loadCompanyList and showCompanyTiles
    await loadCompanyList();
  }

  uploadForm.addEventListener('submit', async e => {
    e.preventDefault();
    const companyName = companySelect.value.trim();
    if (!companyName) return alert('Please enter a company name');

    // Check if company exists
    const companyId = companyMap[companyName.toLowerCase()];
    if (!companyId) {
      alert('Company does not exist. Please select from the list or add it first.');
      return;
    }

    const file = imageInput.files[0];
    const name = imageNameInput.value.trim();
    if (!file || !name) return;

    // Check for duplicate name in the same company
    const companySnap = await get(dbRef(database, `companies/${companyId}`));
    if (companySnap.exists() && companySnap.val().qrCodes) {
      const existingNames = Object.values(companySnap.val().qrCodes).map(tile => tile.name.toLowerCase());
      if (existingNames.includes(name.toLowerCase())) {
        uploadMessage.textContent = 'A tile with this name already exists in this company. Please choose a different name.';
        uploadMessage.className = 'message error';
        return;
      }
    }

    convertBtn.disabled = true;

    const ext = file.name.split('.').pop();
    const storagePath = `companies/${companyId}/images/${name}_${Date.now()}.${ext}`;
    const storageRef = ref(storage, storagePath);

    const snap = await uploadBytes(storageRef, file);
    const url = await getDownloadURL(snap.ref);

    const tileRef = push(dbRef(database, `companies/${companyId}/qrCodes`));
    await set(tileRef, {
      name,
      imageUrl: url,
      path: storagePath,
      createdAt: new Date().toISOString()
    });

    uploadMessage.textContent = 'Tile image saved successfully';
    uploadMessage.className = 'message success';
    imageInput.value = '';
    imageNameInput.value = '';
    convertBtn.disabled = false;
    if (currentCompanyId === companyId) {
      showCompanyTiles(companyId, companySnap.val().name); // Refresh if viewing the same company
    }
  });

  addCompanyBtn.addEventListener('click', async () => {
    const name = newCompanyNameInput.value.trim();
    if (!name) return alert('Enter company name');

    // Sanitize the name to create a valid Firebase key
    // - Convert to lowercase
    // - Replace spaces and invalid chars with underscores
    // - Remove any remaining invalid characters (Firebase keys can't have ., #, $, [, ], /, etc.)
    const sanitizedKey = name.toLowerCase()
      .replace(/\s+/g, '_')  // Replace spaces with underscores
      .replace(/[^a-z0-9_]/g, '')  // Remove invalid characters (keep only letters, numbers, underscores)
      .substring(0, 50);  // Limit length to avoid overly long keys

    if (!sanitizedKey) return alert('Company name results in an invalid key. Please use letters, numbers, and spaces only.');

    // Check if a company with this sanitized key already exists
    const existingSnap = await get(dbRef(database, `companies/${sanitizedKey}`));
    if (existingSnap.exists()) {
      alert('A company with a similar name already exists. Please choose a different name.');
      return;
    }

    // Save the company using the sanitized name as the key
    const companyRef = dbRef(database, `companies/${sanitizedKey}`);
    await set(companyRef, { name, createdAt: new Date().toISOString() });

    newCompanyNameInput.value = '';
    await loadCompanies();
    await loadCompanyList();
    alert(`Company "${name}" added successfully with key "${sanitizedKey}".`);
  });

  loadCompanies();
  loadTiles();
</script>
</body>
</html>
