<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mera-Tile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Code - Matching Theme and Fully Responsive */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f0ff 0%, #faf6ff 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.6;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(138, 43, 226, 0.1);
            border: 2px solid #8a2be2;
            color: #8a2be2;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            cursor: pointer;
            z-index: 100;
        }
        
        .back-button:hover {
            background: #8a2be2;
            color: white;
            transform: translateX(-5px);
        }
        
        .login-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(138, 43, 226, 0.2);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        
        .login-header {
            margin-bottom: 25px;
        }
        
        .login-header h1 {
            font-size: 2.5rem;
            color: #6a0dad;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .login-header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* Mode Switcher Tabs */
        .login-toggle-container {
            display: flex;
            background: #f0f0f0;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #666;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle-btn.active {
            background: #8a2be2;
            color: white;
            box-shadow: 0 4px 10px rgba(138, 43, 226, 0.2);
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1rem;
            background: #f8f9fa;
            transition: all 0.3s ease;
            min-height: 50px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #8a2be2;
            background: white;
            box-shadow: 0 0 0 3px rgba(138, 43, 226, 0.1);
        }
        
        .password-group {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8a2be2;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
        }
        
        /* ENHANCED SIGN-IN BUTTON STYLE */
        .sign-in-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #7b1fa2 0%, #8a2be2 50%, #9c27b0 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 20px;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 18px rgba(138, 43, 226, 0.35);
            position: relative;
            overflow: hidden;
        }
        
        .sign-in-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 10px 25px rgba(138, 43, 226, 0.5);
            background: linear-gradient(135deg, #8a2be2 0%, #9c27b0 100%);
        }
        
        .sign-in-btn:active:not(:disabled) {
            transform: translateY(1px) scale(0.99);
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
        }
        
        .sign-in-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .register-link {
            color: #8a2be2;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: color 0.3s ease;
        }
        
        .register-link:hover {
            color: #6a0dad;
            text-decoration: underline;
        }
        
        .register-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        .register-section p {
            color: #666;
            margin-bottom: 10px;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 5px;
            display: none;
        }
        
        /* Responsive Design */
        @media (min-width: 1025px) {
            .login-container {
                max-width: 450px;
                padding: 50px;
            }
            .login-header h1 {
                font-size: 3rem;
            }
        }
        
        @media (max-width: 1024px) and (min-width: 481px) {
            body { padding: 15px; }
            .login-container { padding: 35px; max-width: 90%; }
            .login-header h1 { font-size: 2.2rem; }
            .sign-in-btn { font-size: 1.1rem; padding: 15px; }
        }
        
        @media (max-width: 768px) and (min-width: 481px) {
            .login-container { padding: 30px 25px; max-width: 85%; }
            .login-header h1 { font-size: 2rem; }
            .form-group input { padding: 14px; }
        }
        
        @media (max-width: 480px) {
            body { padding: 10px; }
            .back-button { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.9rem; }
            .login-container { padding: 25px 20px; max-width: 95%; border-radius: 15px; }
            .login-header h1 { font-size: 1.8rem; }
            .login-header p { font-size: 1rem; }
            .form-group { margin-bottom: 15px; }
            .form-group input { padding: 12px; font-size: 1rem; min-height: 48px; }
            .sign-in-btn { font-size: 1.05rem; padding: 14px; min-height: 48px; margin-bottom: 15px; }
            .register-section { margin-top: 15px; padding-top: 15px; }
            .register-link { font-size: 0.95rem; }
        }
        
        @media (max-width: 360px) {
            .login-container { padding: 20px 15px; }
            .login-header h1 { font-size: 1.6rem; }
            .form-group input { padding: 10px; }
            .sign-in-btn { padding: 12px; font-size: 0.95rem; }
        }
        
        @media (max-height: 500px) and (orientation: landscape) {
            body { justify-content: flex-start; padding-top: 10px; }
            .login-container { margin-top: 20px; }
        }
        
        /* Animation */
        .login-container {
            animation: slideUp 0.6s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Back Button -->
    <a href="index.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Back
    </a>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-header">
            <h1 id="headerTitle">Login</h1>
            <p id="headerSubtitle">Sign in to your Mera-Tile account</p>
        </div>

        <!-- Mode Toggle Switcher -->
        <div class="login-toggle-container">
            <button type="button" class="toggle-btn active" id="ownerTabBtn" onclick="switchLoginMode('owner')">
                <i class="fas fa-user-shield"></i> Owner Login
            </button>
            <button type="button" class="toggle-btn" id="workerTabBtn" onclick="switchLoginMode('worker')">
                <i class="fas fa-user-gear"></i> Worker Login
            </button>
        </div>
        
        <!-- Owner Login Form -->
        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="email"><i class="fas fa-envelope"></i> Email ID</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Enter your email (e.g., user@example.com)" 
                    autocomplete="email"
                    required
                >
                <div class="error-message" id="emailError">Please enter a valid email address.</div>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <div class="password-group">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Enter your password" 
                        autocomplete="current-password"
                        required
                        minlength="6"
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword('password', 'toggleIcon')" id="togglePasswordBtn">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
                <div class="error-message" id="passwordError">Password must be at least 6 characters long.</div>
            </div>
            
            <button type="submit" class="sign-in-btn" id="signinbtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
            <div style="text-align: right; margin-bottom: 15px;">
                <a href="#" id="forgotPasswordLink" style="color: #8a2be2; font-weight: 500; text-decoration: none;">Forgot Password?</a>
            </div>
        </form>

        <!-- Worker Login Form (Disabled autofill to prevent automatic saved data insertion) -->
        <form id="workerLoginForm" style="display: none;" autocomplete="off">
            <div class="form-group">
                <label for="workerShopId"><i class="fas fa-store"></i> Shop ID (6 Digits)</label>
                <input 
                    type="text" 
                    id="workerShopId" 
                    placeholder="Enter 6-digit Shop ID" 
                    maxlength="6"
                    inputmode="numeric"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="form-group">
                <label for="workerIdInput"><i class="fas fa-id-badge"></i> Worker ID (4 Characters)</label>
                <input 
                    type="text" 
                    id="workerIdInput" 
                    placeholder="Enter 4-character Worker ID" 
                    maxlength="4"
                    autocomplete="off"
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="workerPasswordInput"><i class="fas fa-key"></i> Worker Password (4 Characters)</label>
                <div class="password-group">
                    <input 
                        type="password" 
                        id="workerPasswordInput" 
                        placeholder="Enter 4-character Password" 
                        maxlength="4"
                        autocomplete="new-password"
                        required
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword('workerPasswordInput', 'workerToggleIcon')">
                        <i class="fas fa-eye" id="workerToggleIcon"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="sign-in-btn" id="workerSigninBtn">
                <i class="fas fa-sign-in-alt"></i> Worker Sign In
            </button>
        </form>
        
        <div class="register-section" id="registerSection">
            <p>Not registered yet?</p>
            <a href="register.html" class="register-link">Register here</a>
        </div>
    </div>

    <script>
        // Restrict Shop ID input strictly to 6 NUMERIC digits
        document.getElementById('workerShopId').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
        });

        // Restrict Worker ID input strictly to 4 ALPHANUMERIC characters
        document.getElementById('workerIdInput').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').slice(0, 4);
        });

        // Restrict Worker Password input strictly to 4 ALPHANUMERIC characters
        document.getElementById('workerPasswordInput').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').slice(0, 4);
        });

        // Switch between Owner and Worker login tabs
        function switchLoginMode(mode) {
            const ownerForm = document.getElementById('loginForm');
            const workerForm = document.getElementById('workerLoginForm');
            const ownerBtn = document.getElementById('ownerTabBtn');
            const workerBtn = document.getElementById('workerTabBtn');
            const registerSection = document.getElementById('registerSection');
            const headerTitle = document.getElementById('headerTitle');
            const headerSubtitle = document.getElementById('headerSubtitle');

            if (mode === 'worker') {
                ownerForm.style.display = 'none';
                workerForm.style.display = 'block';
                ownerBtn.classList.remove('active');
                workerBtn.classList.add('active');
                registerSection.style.display = 'none';
                headerTitle.textContent = 'Worker Login';
                headerSubtitle.textContent = 'Access shop worker portal';

                // Clear worker fields when switching to worker mode so browser saved credentials don't auto-populate
                document.getElementById('workerShopId').value = '';
                document.getElementById('workerIdInput').value = '';
                document.getElementById('workerPasswordInput').value = '';

                document.getElementById('workerShopId').focus();
            } else {
                ownerForm.style.display = 'block';
                workerForm.style.display = 'none';
                workerBtn.classList.remove('active');
                ownerBtn.classList.add('active');
                registerSection.style.display = 'block';
                headerTitle.textContent = 'Login';
                headerSubtitle.textContent = 'Sign in to your Mera-Tile account';
                document.getElementById('email').focus();
            }
        }

        // Toggle Password Visibility
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const toggleIcon = document.getElementById(iconId);

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // Client-side validation function
        function validateLoginForm() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const signinbtn = document.getElementById('signinbtn');

            let isValid = true;

            // Reset errors
            emailError.style.display = 'none';
            passwordError.style.display = 'none';

            // Email validation
            if (!email) {
                emailError.textContent = 'Email is required.';
                emailError.style.display = 'block';
                isValid = false;
            } else if (!/\S+@\S+\.\S+/.test(email)) {
                emailError.textContent = 'Please enter a valid email address.';
                emailError.style.display = 'block';
                isValid = false;
            }

            // Password validation
            if (!password) {
                passwordError.textContent = 'Password is required.';
                passwordError.style.display = 'block';
                isValid = false;
            } else if (password.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters long.';
                passwordError.style.display = 'block';
                isValid = false;
            }

            // Enable/disable button
            signinbtn.disabled = !isValid;

            return isValid;
        }

        // Real-time validation on input change
        ['email', 'password'].forEach(id => {
            document.getElementById(id).addEventListener('input', validateLoginForm);
        });

        // Focus on email input on page load
        window.addEventListener('load', function () {
            document.getElementById('email').focus();
        });
    </script>

    <!-- Firebase Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDLwU2O2MQA3SWSlbw9Wa75_KByQ0EkZI8",
            authDomain: "raav3d-50f8c.firebaseapp.com",
            databaseURL: "https://raav3d-50f8c-default-rtdb.firebaseio.com",
            projectId: "raav3d-50f8c",
            storageBucket: "raav3d-50f8c.firebasestorage.app",
            messagingSenderId: "528524618407",
            appId: "1:528524618407:web:acb2c4fca0dcadd7934982"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const auth = getAuth();

        // 1. Owner Login Form Submission
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            if (!validateLoginForm()) return;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const signinbtn = document.getElementById('signinbtn');

            signinbtn.disabled = true;
            signinbtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const uid = user.uid;

                const usersRef = ref(database, 'users');
                const snapshot = await get(usersRef);

                if (!snapshot.exists()) {
                    throw new Error('User data not found in database.');
                }

                let foundShopId = null;
                snapshot.forEach(childSnapshot => {
                    const userData = childSnapshot.val();
                    if (userData.uid === uid) {
                        foundShopId = userData.shopId;
                    }
                });

                if (!foundShopId) {
                    throw new Error('Shop ID not found for this user.');
                }

                await update(ref(database, 'users/' + foundShopId), {
                    last_login: new Date().toISOString()
                });

                localStorage.setItem('shopId', foundShopId);
                window.location.href = 'index.html';

            } catch (error) {
                let errorMessage = 'Login failed. Please try again.';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No user found with this email. Please register first.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Invalid password. Please check and try again.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email format.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = 'Too many failed attempts. Please try again later.';
                } else if (error.code === 'auth/invalid-credential') {
                    errorMessage = 'Firebase: Error (auth/invalid-credential).';
                } else if (error.message) {
                    errorMessage = error.message;
                }

                alert(errorMessage);

                signinbtn.disabled = false;
                signinbtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        });

        // 2. Worker Login Form Submission with Strict Validations and Redirect
        document.getElementById('workerLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const shopId = document.getElementById('workerShopId').value.trim();
            const workerId = document.getElementById('workerIdInput').value.trim();
            const password = document.getElementById('workerPasswordInput').value.trim();
            const workerSigninBtn = document.getElementById('workerSigninBtn');

            // Explicit validation checks
            if (shopId.length !== 6 || !/^\d{6}$/.test(shopId)) {
                alert('Shop ID must be exactly 6 numeric digits.');
                return;
            }

            if (workerId.length !== 4) {
                alert('Worker ID must be exactly 4 letters/numbers.');
                return;
            }

            if (password.length !== 4) {
                alert('Worker Password must be exactly 4 letters/numbers.');
                return;
            }

            workerSigninBtn.disabled = true;
            workerSigninBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

            try {
                // Verify worker exists at path: shops / {shopId} / worker / {workerId}
                const workerRef = ref(database, `shops/${shopId}/worker/${workerId}`);
                const snapshot = await get(workerRef);

                if (!snapshot.exists()) {
                    throw new Error('Worker ID or Shop ID does not exist.');
                }

                const workerData = snapshot.val();

                // Validate Password
                if (workerData.password !== password) {
                    throw new Error('Incorrect Worker Password.');
                }

                // Store Worker Session Details in LocalStorage
                localStorage.setItem('shopId', shopId);
                localStorage.setItem('workerId', workerId);
                localStorage.setItem('workerName', workerData.name || workerId);

                // Instantly forward to workerpage.html with shopId parameter
                window.location.href = `workerpage.html?shopId=${encodeURIComponent(shopId)}`;

            } catch (error) {
                alert(error.message || 'Worker Login Failed. Please try again.');
                workerSigninBtn.disabled = false;
                workerSigninBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Worker Sign In';
            }
        });

        // Forgot Password functionality
        document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            
            if (!email) {
                alert("Please enter your email address first.");
                document.getElementById('email').focus();
                return;
            }

            try {
                const { sendPasswordResetEmail } = await import("https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js");
                await sendPasswordResetEmail(auth, email);
                alert(`A password reset link has been sent to ${email}. Please check your inbox.`);
            } catch (error) {
                console.error("Password reset error:", error);
                let msg = "Failed to send reset email. Please try again.";
                if (error.code === "auth/user-not-found") msg = "No account found with this email.";
                if (error.code === "auth/invalid-email") msg = "Invalid email address format.";
                alert(msg);
            }
        });
    </script>
</body>
</html>
