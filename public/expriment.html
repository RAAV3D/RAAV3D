<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiles Preview Layout</title>

<style>
    body {
        margin: 0;
        background: #222;
        display: flex;
        justify-content: center;
        padding: 20px;
    }

    .preview-container {
        width: 90vw;
        max-width: 900px;
        background: #3b3f45;
        padding: 20px;
        border-radius: 10px;
        position: relative;
    }

    /* TILE AREA */
    .tile-area {
        width: 100%;
        height: 500px;
        background-size: 150px 150px;  /* adjust tile repeat size */
        background-repeat: repeat;
        border-radius: 10px;
        position: relative;
        overflow: hidden;
    }

    /* OBJECTS */
    .object {
        position: absolute;
        width: 180px;
        pointer-events: none;
    }

    .car {
        width: 280px;
        left: 10%;
        top: 40%;
    }

    .chair {
        width: 120px;
        top: 10%;
        right: 12%;
    }

    .table {
        width: 200px;
        top: 40%;
        right: 10%;
    }

</style>
</head>
<body>

<div class="preview-container">

    <!-- TILE AREA -->
    <div class="tile-area" id="tileArea"
         style="background-image:url('tile.jpg');">

        <!-- CAR -->
        <img src="car.png" class="object car">

        <!-- CHAIR -->
        <img src="chair.png" class="object chair">

        <!-- TABLE -->
        <img src="table.png" class="object table">

    </div>

</div>

</body>
</html>
