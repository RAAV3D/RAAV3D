<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company-wise Tile Images</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: linear-gradient(135deg, #f5f0ff, #faf6ff);
      padding: 20px;
      margin: 0;
    }
    .container { max-width: 1200px; margin: auto; display: flex; flex-direction: column; gap: 40px; }
    .card { background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 15px 40px rgba(138,43,226,.2); position: relative; }
    h2 { color: #6a0dad; margin-bottom: 20px; }

    .tile-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(250px,1fr)); gap: 20px; margin-top: 20px; }
    .tile-item { 
      background:#f8f9fa; 
      padding:20px; 
      border-radius:16px; 
      text-align:center; 
      height: 280px;
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.5s ease;
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .tile-item:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(138,43,226,0.3);
    }
    .tile-item img {
      width: 100%;
      height: 150px;
      object-fit: contain;
      border-radius: 10px;
      background: #f9f9f9;
      transition: transform 0.3s ease;
    }
    .tile-item:hover img {
      transform: scale(1.1);
    }
    .tile-item p { margin-top:10px; font-weight:600; color:#6a0dad; }
    .actions { display:flex; justify-content:center; gap:10px; margin-top:10px; }
    .actions button { background:none; color:#555; font-size:1.2rem; transition: color 0.3s; }
    .actions button:hover { color:#8a2be2; }

    .search-container { 
      display: flex; 
      gap: 0; 
      align-items: center; 
      margin-bottom: 20px; 
      border-radius: 25px; 
      overflow: hidden; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
      background: #fff; 
      border: 2px solid #e0e0e0; 
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .tile-search { 
      flex: 1; 
      padding: 14px 20px; 
      border: none; 
      outline: none; 
      font-size: 1rem; 
      border-radius: 0; 
    }
    .search-btn { 
      padding: 14px 20px; 
      background: linear-gradient(135deg,#8a2be2,#9370db); 
      color: white; 
      border: none; 
      cursor: pointer; 
      font-size: 1rem; 
      transition: background 0.3s; 
    }
    .search-btn:hover { background: #9370db; }

    .company-list { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; width: 100%; }
    .company-item {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7b2ff7, #8f4df8);
      color: #fff;
      padding: 18px 20px;
      border-radius: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      animation: fadeIn 0.5s ease forwards;
    }
    .company-item:hover { background: #9370db; transform: translateY(-5px); }
    .company-item h3 { color: white; margin: 0; }
    .back-btn { margin-bottom: 20px; background: #6a0dad; padding: 10px 20px; border-radius: 12px; color: white; cursor: pointer; transition: background 0.3s; }
    .back-btn:hover { background: #5a0b8a; }

    .hidden { display: none; }
    .company-wrapper { display: flex; align-items: center; gap: 10px; }
    .company-number { font-weight: bold; color: #6a0dad; font-size: 1.2rem; }

    .update-images-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #6a0dad;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.3s;
      z-index: 10;
    }
    .update-images-btn:hover { background: #5a0b8a; }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 300px;
      width: 90%;
    }
    .modal-content h3 { margin-bottom: 20px; color: #6a0dad; }
    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .modal-btn.mail { background: #8a2be2; color: white; }
    .modal-btn.mail:hover { background: #9370db; }
    .modal-btn.phone { background: #25d366; color: white; }
    .modal-btn.phone:hover { background: #128c7e; }

    .loading { text-align: center; color: #6a0dad; font-size: 1.2rem; }
    .error-state { text-align: center; color: #d9534f; font-size: 1.1rem; padding: 20px; }

    /* Mobile-Friendly Improvements */
    @media (max-width: 768px) {
      .tile-grid { grid-template-columns: 1fr; }
      .company-list { grid-template-columns: 1fr; }
      .search-btn, .modal-btn, .actions button, .update-images-btn, .back-btn {
        padding: 16px 24px;
        font-size: 1.2rem;
      }
      .back-btn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
      }
      .tile-item, .company-item { animation-delay: 0.1s; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="card">
    <h2 id="companyHeader"><i class="fas fa-image"></i> Company-wise Tile QRcodes</h2>
    <button class="update-images-btn" id="updateBtn">Update Tiles</button>
    <div class="search-container">
      <input
        type="text"
        class="tile-search"
        placeholder="Search..."
        id="tileSearchInput">
      <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <button class="back-btn hidden" id="backBtn"><i class="fas fa-arrow-left"></i> Back to Companies</button>
    <div id="companyList" class="company-list"></div>
    <div id="tileGrid" class="tile-grid hidden"></div>
  </div>

  <div id="updateModal" class="modal">
    <div class="modal-content">
      <h3>Select Update Method</h3>
      <div class="modal-buttons">
        <button class="modal-btn mail" id="mailBtn">Via Mail ID</button>
        <button class="modal-btn phone" id="phoneBtn">WhatsApp</button>
      </div>
    </div>
  </div>

</div>

<script type="module">
    import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.3/+esm";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getStorage, ref, deleteObject } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-storage.js";
  import { getDatabase, ref as dbRef, get, remove } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDLwU2O2MQA3SWSlbw9Wa75_KByQ0EkZI8",
    authDomain: "raav3d-50f8c.firebaseapp.com",
    databaseURL: "https://raav3d-50f8c-default-rtdb.firebaseio.com",
    projectId: "raav3d-50f8c",
    storageBucket: "raav3d-50f8c.firebasestorage.app",
    messagingSenderId: "528524618407",
    appId: "1:528524618407:web:acb2c4fca0dcadd7934982"
  };

  const app = initializeApp(firebaseConfig);
  const storage = getStorage(app);
  const database = getDatabase(app);

  const companyList = document.getElementById('companyList');
  const tileGrid = document.getElementById('tileGrid');
  const tileSearchInput = document.getElementById('tileSearchInput');
  const searchBtn = document.getElementById('searchBtn');
  const backBtn = document.getElementById('backBtn');
  const companyHeader = document.getElementById('companyHeader');
  const updateModal = document.getElementById('updateModal');
  const mailBtn = document.getElementById('mailBtn');
  const phoneBtn = document.getElementById('phoneBtn');
  const updateBtn = document.getElementById('updateBtn');

  let currentCompanyId = null;

  function normalizeText(text) {
    return text.toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function filterItems() {
    const searchText = normalizeText(tileSearchInput.value);

    if (!tileGrid.classList.contains('hidden')) {
      document.querySelectorAll('.tile-item').forEach(tile => {
        const name = normalizeText(tile.querySelector('p').textContent);
        const shouldShow = name.includes(searchText);
        tile.style.display = shouldShow ? 'block' : 'none';
        
        if (shouldShow) {
          const img = tile.querySelector('img');
          if (img && img.hasAttribute('data-src') && img.src === '') {
            img.src = img.getAttribute('data-src');
            img.removeAttribute('data-src');
            img.onerror = () => {
              img.src = 'https://via.placeholder.com/150?text=Image+Not+Found';
              img.onerror = null;
            };
          }
        }
      });
    } else {
      document.querySelectorAll('.company-wrapper').forEach(wrapper => {
        const company = wrapper.querySelector('.company-item h3');
        const name = normalizeText(company.textContent);
        wrapper.style.display = name.includes(searchText) ? 'block' : 'none';
      });

      let visibleIndex = 1;
      document.querySelectorAll('.company-wrapper').forEach(wrapper => {
        if (wrapper.style.display !== 'none') {
          wrapper.querySelector('.company-number').textContent = `${visibleIndex}.`;
          visibleIndex++;
        }
      });
    }
  }

  searchBtn.addEventListener('click', filterItems);
  tileSearchInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') filterItems();
  });

  backBtn.addEventListener('click', () => {
    companyList.classList.remove('hidden');
    tileGrid.classList.add('hidden');
    backBtn.classList.add('hidden');
    tileSearchInput.value = '';
    filterItems();
    currentCompanyId = null;
  });

  document.addEventListener('click', (e) => {
    if (e.target === updateModal) updateModal.style.display = 'none';
  });

  updateBtn.addEventListener('click', () => {
    updateModal.style.display = 'flex';
  });

  mailBtn.addEventListener('click', () => {
    updateModal.style.display = 'none';
    window.location.href = 'mailto:raav2d3d@gmail.com?subject=Update Images&body=Please find attached the updated images.';
  });

  phoneBtn.addEventListener('click', () => {
    updateModal.style.display = 'none';
    window.location.href = 'whatsapp://send?phone=6364432791&text=Please find attached the updated images.';
  });

  async function loadCompanyList() {
    companyList.innerHTML = '<div class="loading">Loading companies...</div>';
    const snap = await get(dbRef(database, 'companies'));
    companyList.innerHTML = '';
    if (!snap.exists()) {
      companyList.innerHTML = '<div class="error-state">No companies found. Please add some companies first.</div>';
      return;
    }

    const companies = [];
    snap.forEach(companySnap => {
      companies.push({ id: companySnap.key, name: companySnap.val().name });
    });

    companies.sort((a, b) => a.name.localeCompare(b.name));

    companyHeader.innerHTML = `<i class="fas fa-image"></i> Company-wise Tile Images (${companies.length} Companies)`;

    companies.forEach((company, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'company-wrapper';

      const number = document.createElement('span');
      number.className = 'company-number';
      number.textContent = `${index + 1}.`;

      const item = document.createElement('div');
      item.className = 'company-item';
      item.innerHTML = `<h3>${company.name}</h3>`;
      item.onclick = () => showCompanyTiles(company.id, company.name);

      wrapper.appendChild(number);
      wrapper.appendChild(item);
      companyList.appendChild(wrapper);
    });
  }

  async function showCompanyTiles(companyId, companyName) {
    currentCompanyId = companyId;
    tileGrid.innerHTML = `<h3>${companyName}</h3>`;
    const snap = await get(dbRef(database, `companies/${companyId}/qrCodes`));
    if (!snap.exists()) {
      tileGrid.innerHTML += '<div class="error-state">No tiles available for this company.</div>';
      return;
    }

    const tiles = [];
    Object.entries(snap.val()).forEach(([id, tile]) => {
      tiles.push({ id, ...tile });
    });

    tiles.sort((a, b) => a.name.localeCompare(b.name));

    tiles.forEach((tile, index) => {
      const item = document.createElement('div');
      item.className = 'tile-item';

      const img = document.createElement('img');
      img.src = '';
      img.setAttribute('data-src', tile.imageUrl);
      img.alt = tile.name;
      img.onerror = () => {
        img.src = 'https://via.placeholder.com/150?text=Image+Not+Found';
        img.onerror = null;
      };
      item.appendChild(img);

      const p = document.createElement('p');
      p.textContent = `${index + 1}. ${tile.name}`;
      item.appendChild(p);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const downloadBtn = document.createElement('button');
      downloadBtn.innerHTML = '<i class="fas fa-download"></i>';
      downloadBtn.onclick = async () => {
        try {
          const qrDataURL = await QRCode.toDataURL(tile.imageUrl, { width: 256, height: 256 });

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = 256;
          canvas.height = 320;

          const qrImg = new Image();
          qrImg.src = qrDataURL;
          await new Promise(resolve => qrImg.onload = resolve);
          ctx.drawImage(qrImg, 0, 0, 256, 256);

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 256, 256, 64);

          ctx.fillStyle = '#000000';
          ctx.font = '20px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(tile.name, 128, 288);

          const compositeDataURL = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.href = compositeDataURL;
          link.download = tile.name + '_QR.png';
          link.click();
        } catch (error) {
          console.error('Error generating QR code:', error);
          alert('Failed to generate QR code.');
        }
      };
      actions.appendChild(downloadBtn);
      item.appendChild(actions);

      tileGrid.appendChild(item);
    });

    companyList.classList.add('hidden');
    tileGrid.classList.remove('hidden');
    backBtn.classList.remove('hidden');
    tileSearchInput.value = '';

    const images = tileGrid.querySelectorAll('img[data-src]');
    const imageObserver = new IntersectionObserver((entries, observer) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const img = entry.target;
          img.src = img.getAttribute('data-src');
          img.removeAttribute('data-src');
          observer.unobserve(img);
        }
      });
    }, {
      rootMargin: '100px'
    });

    images.forEach(img => imageObserver.observe(img));
  }

  async function loadTiles() {
    await loadCompanyList();
  }

  loadTiles();
</script>
</body>
</html>
